<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Bee My Valentine? 🐝💛</title>
    
    <style>
        /* ==================== GLOBAL STYLES ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fff9e6 0%, #ffeb99 50%, #ffd966 100%);
            overflow-x: hidden;
            position: relative;
            /* Prevent pull-to-refresh and overscroll on mobile */
            overscroll-behavior: none;
            /* Improve touch responsiveness */
            touch-action: pan-y;
        }

        /* Animated bees background */
        body::before {
            content: '🐝 🍯 🐝 🌻 🐝 🍯 🐝 🌻';
            position: fixed;
            top: -50px;
            left: 0;
            width: 100%;
            font-size: 2rem;
            opacity: 0.15;
            animation: float 20s infinite linear;
            z-index: 0;
        }
        
        /* Additional floating bees */
        body::after {
            content: '🌼 🐝 💛 🐝 🌼 🐝 💛 🐝';
            position: fixed;
            bottom: -50px;
            right: 0;
            width: 100%;
            font-size: 1.8rem;
            opacity: 0.12;
            animation: floatReverse 25s infinite linear;
            z-index: 0;
        }

        @keyframes float {
            from { transform: translateY(0) translateX(0); }
            to { transform: translateY(100vh) translateX(-20px); }
        }
        
        @keyframes floatReverse {
            from { transform: translateY(0) translateX(0); }
            to { transform: translateY(-100vh) translateX(20px); }
        }

        /* ==================== MAIN CONTAINER ==================== */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem 2rem;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 193, 7, 0.3);
            max-width: 600px;
            width: 90%;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            border: 3px solid #ffc107;
            overflow: visible;
            animation: containerBounce 2s ease-in-out infinite;
        }
        
        @keyframes containerBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ==================== HEADING ==================== */
        h1 {
            font-size: 2.5rem;
            color: #f57f17;
            margin-bottom: 1.5rem;
            text-shadow: 2px 2px 4px rgba(255, 193, 7, 0.3);
            animation: headingWiggle 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes headingWiggle {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.05) rotate(-2deg); }
            75% { transform: scale(1.05) rotate(2deg); }
        }

        /* ==================== IMAGE CONTAINER ==================== */
        .image-container {
            margin: 2rem auto;
            max-width: 400px;
            width: 100%;
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            animation: imageBounce 4s ease-in-out infinite;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .image-container:hover img {
            transform: scale(1.1) rotate(2deg);
            animation: imageWobble 0.5s ease-in-out;
        }
        
        @keyframes imageBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        @keyframes imageWobble {
            0%, 100% { transform: scale(1.1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(-3deg); }
            75% { transform: scale(1.1) rotate(3deg); }
        }

        /* ==================== BUTTON CONTAINER ==================== */
        .button-container {
            margin-top: 2rem;
            position: relative;
            min-height: 200px; /* Increased height to give more space for No button movement */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            /* This ensures the No button positioning is relative to the container */
        }

        /* ==================== YES BUTTON ==================== */
        .yes-btn {
            background: linear-gradient(135deg, #ffc107, #ffb300);
            color: #000;
            border: none;
            padding: 1.2rem 3rem;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4);
            position: relative;
            z-index: 10;
            animation: yesBtnPulse 2s ease-in-out infinite;
        }
        
        @keyframes yesBtnPulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4);
            }
            50% { 
                transform: scale(1.08);
                box-shadow: 0 8px 25px rgba(255, 193, 7, 0.6);
            }
        }

        .yes-btn:hover {
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 193, 7, 0.6);
            background: linear-gradient(135deg, #ffb300, #ffa000);
            animation: none;
        }

        .yes-btn:active {
            transform: translateY(-1px);
        }

        /* ==================== NO BUTTON ==================== */
        .no-btn {
            background: linear-gradient(135deg, #ddd, #bbb);
            color: #666;
            border: none;
            padding: 1.2rem 3rem;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 5;
        }
        
        /* When the button has been clicked, it becomes fixed position */
        .no-btn.moving {
            position: fixed;
            animation: noBtnShake 0.5s ease-in-out;
        }
        
        @keyframes noBtnShake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .no-btn:hover {
            background: linear-gradient(135deg, #ccc, #aaa);
            animation: noBtnWiggle 0.3s ease-in-out;
        }
        
        @keyframes noBtnWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }
        
        /* Prevent text selection on buttons for better mobile experience */
        .yes-btn, .no-btn {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ==================== HIDDEN STATE ==================== */
        .hidden {
            display: none !important;
        }

        /* ==================== SUCCESS MESSAGE ==================== */
        .success-message {
            margin-top: 2rem;
            padding: 2rem;
            background: linear-gradient(135deg, #fff9e6, #ffeb99);
            border-radius: 20px;
            animation: successBounce 0.6s ease-out;
            border: 2px solid #ffc107;
            box-shadow: 0 10px 40px rgba(255, 193, 7, 0.4);
        }

        .success-message h2 {
            color: #f57f17;
            font-size: 2rem;
            margin-bottom: 1rem;
            animation: successTextBounce 0.8s ease-out;
        }

        .success-message p {
            color: #f57f17;
            font-size: 1.2rem;
            line-height: 1.6;
            animation: successTextFade 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes successBounce {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-10deg);
            }
            50% {
                transform: scale(1.1) rotate(5deg);
            }
            70% {
                transform: scale(0.95) rotate(-3deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }
        
        @keyframes successTextBounce {
            0%, 100% { transform: translateY(0); }
            10%, 30%, 50% { transform: translateY(-10px); }
            20%, 40% { transform: translateY(-5px); }
        }
        
        @keyframes successTextFade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==================== HINT MESSAGE ==================== */
        .hint-message {
            margin-top: 1.5rem;
            color: #f57f17;
            font-size: 1.1rem;
            font-style: italic;
            animation: hintPulse 1.5s ease-in-out infinite;
        }
        
        @keyframes hintPulse {
            0%, 100% { 
                opacity: 0.7;
                transform: scale(1);
            }
            50% { 
                opacity: 1;
                transform: scale(1.05);
            }
        }

        /* ==================== CONFETTI ANIMATION ==================== */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ffc107;
            position: fixed;
            top: -10px;
            z-index: 1000;
            animation: confetti-fall 3s linear forwards;
            border-radius: 50%;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* ==================== FLOATING HEARTS ANIMATION ==================== */
        .heart {
            position: fixed;
            font-size: 2rem;
            bottom: -50px;
            animation: float-up 4s ease-in forwards;
            z-index: 1000;
            pointer-events: none;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0) rotate(0deg) translateX(0);
                opacity: 1;
            }
            50% {
                opacity: 1;
                transform: translateY(-50vh) rotate(180deg) translateX(30px);
            }
            100% {
                transform: translateY(-100vh) rotate(360deg) translateX(-20px);
                opacity: 0;
            }
        }

        /* ==================== RESPONSIVE DESIGN ==================== */
        
        /* Tablets and smaller desktops */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .image-container {
                height: 300px;
                max-width: 300px;
            }

            .yes-btn, .no-btn {
                padding: 1rem 2rem;
                font-size: 1.2rem;
            }

            .button-container {
                gap: 1rem;
                min-height: 180px; /* Adequate space for button movement */
            }

            .container {
                padding: 2rem 1.5rem;
                width: 95%;
            }
            
            .success-message h2 {
                font-size: 1.5rem;
            }
            
            .success-message p {
                font-size: 1rem;
            }
        }

        /* Mobile phones */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
                margin-bottom: 1rem;
            }

            .image-container {
                height: 220px;
                max-width: 220px;
                margin: 1.5rem auto;
            }

            .yes-btn, .no-btn {
                padding: 0.9rem 1.8rem;
                font-size: 1.1rem;
                min-width: 120px;
            }
            
            .button-container {
                min-height: 160px; /* Adequate space for button movement on mobile */
            }
            
            .container {
                padding: 1.5rem 1rem;
            }
            
            .success-message {
                padding: 1.5rem;
                margin-top: 1.5rem;
            }
            
            .success-message h2 {
                font-size: 1.3rem;
            }
            
            .success-message p {
                font-size: 0.95rem;
            }
            
            .hint-message {
                font-size: 1rem;
            }
        }
        
        /* Very small phones */
        @media (max-width: 360px) {
            h1 {
                font-size: 1.3rem;
            }
            
            .image-container {
                height: 200px;
                max-width: 200px;
            }
            
            .yes-btn, .no-btn {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
                min-width: 100px;
            }
            
            .container {
                padding: 1rem 0.8rem;
            }
            
            .button-container {
                min-height: 140px;
            }
        }
        
        /* Landscape mode on mobile */
        @media (max-height: 600px) and (orientation: landscape) {
            .container {
                padding: 1rem;
            }
            
            h1 {
                font-size: 1.3rem;
                margin-bottom: 0.5rem;
            }
            
            .image-container {
                height: 180px;
                max-width: 180px;
                margin: 1rem auto;
            }
            
            .button-container {
                margin-top: 1rem;
                min-height: 120px;
            }
            
            .yes-btn, .no-btn {
                padding: 0.7rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main Heading -->
        <h1>🐝 Will You BEE My Valentine? 🍯</h1>

        <!-- Image Container -->
        <!-- REPLACE IMAGES: Add your image files to the same folder as this HTML file -->
        <!-- Then update the 'images' array in the JavaScript section below -->
        <div class="image-container">
            <img id="mainImage" src="https://images.unsplash.com/photo-1558642452-9d2a7deb7f62?w=600&h=600&fit=crop" alt="Bee or honeycomb image">
        </div>

        <!-- Button Container -->
        <div class="button-container">
            <button class="yes-btn" id="yesBtn">Yes! 🐝💛</button>
            <button class="no-btn" id="noBtn">No</button>
        </div>

        <!-- Hint Message (shown after several "No" clicks) -->
        <div class="hint-message hidden" id="hintMessage">
            There's only one right answer... 🐝😊
        </div>

        <!-- Success Message (shown when "Yes" is clicked) -->
        <div class="success-message hidden" id="successMessage">
            <h2>🎉 Yay! You Made Me The Happiest Bee! 🎉</h2>
            <p>I knew you'd say yes! 🐝<br>You're the sweetest Valentine ever! 🍯</p>
            <p style="margin-top: 1rem; font-size: 2rem;">🐝💛🍯🌻🐝💛🍯🌻</p>
        </div>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        
        // IMAGE ARRAY - Replace these URLs with your own image paths
        // Example: If your images are named "pic1.jpg", "pic2.jpg", etc. in the same folder
        // Use: const images = ['pic1.jpg', 'pic2.jpg', 'pic3.jpg', ...];
        const images = [
            "IMG_20260129_180554_653.jpg",
            "fineshyt di TikTok.jfif"
        ];

        // Playful messages for the "No" button (bee themed!)
        const noButtonTexts = [
            "Are you sure? 🐝",
            "Really? 🍯",
            "Think again! 🌻",
            "Please? 🐝",
            "But why not? 💛",
            "Give me a chance! 🐝",
            "Pretty please? 🌼",
            "You're un-bee-lievable! 😢",
            "Last chance! 🐝",
            "Bee-lieve me! 🍯"
        ];

        // ==================== VARIABLES ====================
        let noClickCount = 0;
        let currentImageIndex = 0;
        const maxNoClicks = 10;

        // ==================== DOM ELEMENTS ====================
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const mainImage = document.getElementById('mainImage');
        const successMessage = document.getElementById('successMessage');
        const hintMessage = document.getElementById('hintMessage');
        const buttonContainer = document.querySelector('.button-container');

        // ==================== FUNCTIONS ====================

        /**
         * Changes the main image to the next one in the array
         * Cycles through images sequentially
         */
        function changeImage() {
            currentImageIndex = (currentImageIndex + 1) % images.length;
            mainImage.src = images[currentImageIndex];
        }

        /**
         * Moves the "No" button to a random position on the screen
         * Ensures the button stays within the container boundaries
         * Prevents overlap with the Yes button
         * Works on both desktop and mobile devices
         */
        function moveNoButton() {
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            const yesBtnRect = yesBtn.getBoundingClientRect();
            const containerRect = document.querySelector('.container').getBoundingClientRect();
            
            // Add margin to keep button away from edges
            const margin = 20;
            const overlapBuffer = 20; // Extra space to prevent any overlap
            
            // Calculate safe bounds within the container
            const minX = containerRect.left + margin;
            const maxX = containerRect.right - btnWidth - margin;
            const minY = containerRect.top + margin;
            const maxY = containerRect.bottom - btnHeight - margin;
            
            let randomX, randomY;
            let attempts = 0;
            const maxAttempts = 100;
            let validPosition = false;
            
            // Keep trying until we find a position that doesn't overlap with Yes button
            while (!validPosition && attempts < maxAttempts) {
                randomX = minX + Math.random() * (maxX - minX);
                randomY = minY + Math.random() * (maxY - minY);
                
                // Create a rectangle for the proposed No button position
                const proposedRect = {
                    left: randomX,
                    right: randomX + btnWidth,
                    top: randomY,
                    bottom: randomY + btnHeight
                };
                
                // Check if there's NO overlap (with buffer zone)
                const noOverlap = (
                    proposedRect.right + overlapBuffer < yesBtnRect.left ||
                    proposedRect.left - overlapBuffer > yesBtnRect.right ||
                    proposedRect.bottom + overlapBuffer < yesBtnRect.top ||
                    proposedRect.top - overlapBuffer > yesBtnRect.bottom
                );
                
                if (noOverlap) {
                    validPosition = true;
                } else {
                    attempts++;
                }
            }
            
            // Apply position using fixed positioning
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        /**
         * Handles the "No" button click event
         * - Changes image
         * - Updates button text
         * - Moves button randomly
         * - Shrinks button size
         * - Adds rotation effect
         * - Tracks click count
         * - Hides button after max clicks
         */
        function handleNoClick(e) {
            // Prevent default behavior on touch devices
            if (e) {
                e.preventDefault();
            }
            
            noClickCount++;
            
            // On first click, change to fixed positioning so it can move freely
            if (noClickCount === 1) {
                noBtn.classList.add('moving');
            }
            
            // Change the main image
            changeImage();
            
            // Update button text with playful messages
            if (noClickCount <= noButtonTexts.length) {
                noBtn.textContent = noButtonTexts[noClickCount - 1];
            }
            
            // Move button to random position
            moveNoButton();
            
            // Shrink the button gradually (reduces by 8% each click)
            // Rotate slightly for playful effect (5 degrees per click to keep text readable)
            const newScale = 1 - (noClickCount * 0.08);
            noBtn.style.transform = `scale(${newScale}) rotate(${noClickCount * 5}deg)`;
            
            // Show hint message after 5 clicks
            if (noClickCount >= 5) {
                hintMessage.classList.remove('hidden');
            }
            
            // After 10 clicks, hide the "No" button completely
            if (noClickCount >= maxNoClicks) {
                noBtn.classList.add('hidden');
                hintMessage.textContent = "There's only one button left... 🐝💛";
            }
        }

        /**
         * Creates confetti animation
         * Generates random colored confetti pieces that fall from top
         */
        function createConfetti() {
            const colors = ['#ffc107', '#ffb300', '#000000', '#ffa000', '#ffecb3'];
            
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
                    
                    // Random sizes
                    const size = 8 + Math.random() * 8;
                    confetti.style.width = size + 'px';
                    confetti.style.height = size + 'px';
                    
                    // Random shapes
                    if (Math.random() > 0.5) {
                        confetti.style.borderRadius = '50%';
                    } else {
                        confetti.style.borderRadius = '0';
                    }
                    
                    document.body.appendChild(confetti);
                    
                    // Remove confetti after animation
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 30);
            }
        }

        /**
         * Creates floating bees and honey animation
         * Generates bee and honey emojis that float up from bottom
         */
        function createFloatingHearts() {
            const beeEmojis = ['🐝', '🍯', '💛', '🌻', '🌼', '🐝'];
            
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.textContent = beeEmojis[Math.floor(Math.random() * beeEmojis.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDelay = Math.random() * 0.5 + 's';
                    heart.style.animationDuration = (3 + Math.random() * 2) + 's';
                    
                    // Random sizes
                    const size = 1.5 + Math.random() * 1.5;
                    heart.style.fontSize = size + 'rem';
                    
                    document.body.appendChild(heart);
                    
                    // Remove heart after animation
                    setTimeout(() => heart.remove(), 5000);
                }, i * 80);
            }
        }

        /**
         * Handles the "Yes" button click event
         * - Changes image
         * - Shows success message
         * - Triggers confetti and hearts animation
         * - Hides buttons
         */
        function handleYesClick(e) {
            // Prevent default behavior on touch devices
            if (e) {
                e.preventDefault();
            }
            
            // Change the main image
            changeImage();
            
            // Hide all buttons
            buttonContainer.classList.add('hidden');
            hintMessage.classList.add('hidden');
            
            // Show success message
            successMessage.classList.remove('hidden');
            
            // Trigger celebrations
            createConfetti();
            createFloatingHearts();
        }

        // ==================== EVENT LISTENERS ====================
        // Support both click and touch events for cross-platform compatibility
        yesBtn.addEventListener('click', handleYesClick);
        yesBtn.addEventListener('touchstart', handleYesClick, { passive: false });
        
        noBtn.addEventListener('click', handleNoClick);
        noBtn.addEventListener('touchstart', handleNoClick, { passive: false });
        
        // Handle viewport resize (important for mobile orientation changes)
        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                // If No button has been clicked and is moving, reposition it safely
                if (noClickCount > 0 && !noBtn.classList.contains('hidden') && noBtn.classList.contains('moving')) {
                    moveNoButton();
                }
            }, 250);
        });

        // ==================== INITIALIZATION ====================
        // Set initial image
        mainImage.src = images[0];
    </script>
</body>
</html>
